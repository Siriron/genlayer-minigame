<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryForge — GenLayer Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1a1a24;
      --border: #1e1e2e;
      --accent: #f5a623;
      --accent2: #7b5ea7;
      --correct: #00e5a0;
      --danger: #ff4d6d;
      --text: #e8e8f0;
      --muted: #6b6b80;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    nav {
      width: 100%; max-width: 760px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2.5rem;
    }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    nav a:hover { color: var(--accent); }
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.05em; text-align: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 0.5rem;
    }
    .subtitle { color: var(--muted); text-align: center; margin-bottom: 2.5rem; font-size: 0.95rem; }
    .btn {
      background: var(--accent); color: #000; border: none; border-radius: 10px;
      padding: 0.75rem 1.75rem; font-family: 'DM Sans', sans-serif;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--correct); border: 1px solid var(--correct); }
    #walletSection { margin-bottom: 2rem; text-align: center; }
    .wallet-info { display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; }
    .wallet-addr {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--muted);
    }
    .score-badge {
      background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.3);
      color: var(--accent); border-radius: 8px; padding: 0.5rem 1rem;
      font-size: 0.85rem; font-weight: 600;
    }
    .card {
      width: 100%; max-width: 680px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    .card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.05em; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.4rem; }
    input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1rem; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .topic-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
    .topic-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.5rem 0.25rem; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem; cursor: pointer;
      transition: all 0.15s; text-align: center;
    }
    .topic-btn:hover { border-color: var(--accent); color: var(--text); }
    .topic-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(245,166,35,0.08); }

    /* Story display */
    .story-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .story-headline {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
      letter-spacing: 0.03em; color: var(--accent); line-height: 1.3;
    }
    .story-intro { font-size: 0.95rem; line-height: 1.65; color: var(--text); }
    .story-prompt { font-size: 0.85rem; color: var(--muted); font-style: italic; }

    textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1rem; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      outline: none; resize: vertical; min-height: 120px; line-height: 1.6;
    }
    textarea:focus { border-color: var(--accent); }
    .char-count { font-size: 0.8rem; color: var(--muted); text-align: right; }

    /* Result */
    .result-card {
      width: 100%; max-width: 680px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
      display: none; flex-direction: column; gap: 1.25rem; align-items: center;
      text-align: center;
    }
    .result-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 0.05em; }
    .score-display {
      font-family: 'Bebas Neue', sans-serif; font-size: 5rem; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .feedback-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem; font-size: 0.9rem;
      color: var(--text); line-height: 1.6; text-align: left; width: 100%;
    }
    .feedback-box strong { color: var(--accent); }

    /* Leaderboard */
    #leaderboardSection { width: 100%; max-width: 680px; margin-top: 2rem; }
    #leaderboardSection h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .lb-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; margin-bottom: 0.5rem; font-size: 0.9rem;
    }
    .lb-row .rank { color: var(--muted); width: 2rem; }
    .lb-row .nick { flex: 1; }
    .lb-row .pts { color: var(--accent); font-weight: 600; }
    #status { text-align: center; color: var(--muted); font-size: 0.9rem; min-height: 1.4rem; margin-top: 0.5rem; }
    .loading { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<nav>
  <a href="/">← All Games</a>
  <a href="/storyforge">StoryForge</a>
</nav>

<h1 class="title">StoryForge</h1>
<p class="subtitle">A real news story is fetched live. You write what happened next. AI judges your ending.</p>

<div id="walletSection">
  <button class="btn" id="connectBtn">Connect Wallet</button>
</div>

<!-- Setup -->
<div id="setupSection" class="card hidden">
  <h2>New Story Round</h2>
  <div>
    <label>Your Nickname</label>
    <input type="text" id="nicknameInput" placeholder="Enter nickname..." maxlength="25" />
  </div>
  <div>
    <label>Pick a Topic</label>
    <div class="topic-grid">
      <button class="topic-btn active" data-topic="World">🌍 World</button>
      <button class="topic-btn" data-topic="Tech">💻 Tech</button>
      <button class="topic-btn" data-topic="Science">🔬 Science</button>
      <button class="topic-btn" data-topic="Crypto">₿ Crypto</button>
      <button class="topic-btn" data-topic="Business">📈 Business</button>
    </div>
  </div>
  <button class="btn" id="startBtn">⚡ Fetch Story</button>
  <div id="status"></div>
</div>

<!-- Game: Write Ending -->
<div id="gameSection" class="card hidden">
  <h2>Complete the Story</h2>
  <div class="story-box">
    <div class="story-headline" id="storyHeadline">Loading story...</div>
    <div class="story-intro" id="storyIntro"></div>
    <div class="story-prompt">✍️ What happened next? Write your ending below.</div>
  </div>
  <div>
    <label>Your Ending</label>
    <textarea id="endingInput" placeholder="Write 2-3 sentences about what you think happened next..." maxlength="500"></textarea>
    <div class="char-count"><span id="charCount">0</span>/500</div>
  </div>
  <button class="btn" id="submitBtn">Submit Ending →</button>
  <div id="status"></div>
</div>

<!-- Result -->
<div id="resultSection" class="result-card">
  <h2>AI Verdict</h2>
  <div class="score-display" id="scoreDisplay">0</div>
  <p style="color:var(--muted);font-size:0.9rem;">out of 100 points</p>
  <div class="feedback-box" id="feedbackBox"></div>
  <button class="btn" id="playAgainBtn" style="margin-top:0.5rem;">Play Again</button>
</div>

<!-- Leaderboard -->
<div id="leaderboardSection">
  <h3>🏆 Leaderboard</h3>
  <div id="leaderboardList"></div>
  <button class="btn-outline btn" style="margin-top:1rem;width:100%;max-width:680px;" onclick="loadLeaderboard()">Refresh</button>
</div>

<script type="module">
const CONFIG = {
  GAME_CONTRACT: "0xB37838E502e272Bd3bfBF34F3a46616C55867Ee1",
  STORAGE_CONTRACT: "0x914D51a7F44cD9649b1d9495578D8AA5FfeC8982",
  STAT_CONTRACT: "0x9706EF854673dDeA6c0F07F3288fFE461a738050",
  RPC_URL: "https://studio.genlayer.com/api",
};

let walletAddress = null;
let currentRound = null;
let selectedTopic = "World";
let totalScore = 0;

// ─── SAME ENCODING AS COUNTRYCLASH ───────────────────────────────────────────
function encodeCall(method, args) {
  const sig = method + "(" + args.map(a => typeof a === "number" ? "uint256" : "string").join(",") + ")";
  const hash = keccak256(sig).slice(0, 10);
  const encoded = args.map(a => {
    if (typeof a === "number") return a.toString(16).padStart(64, "0");
    const hex = Array.from(new TextEncoder().encode(a)).map(b => b.toString(16).padStart(2,"0")).join("");
    const offset = (64).toString(16).padStart(64, "0");
    const len = (a.length).toString(16).padStart(64, "0");
    const data = hex.padEnd(Math.ceil(hex.length / 64) * 64, "0");
    return offset + len + data;
  });
  return hash + encoded.join("");
}

function keccak256(str) {
  if (window.ethers) return window.ethers.utils.id(str);
  return "0x" + Array.from(str).map(c => c.charCodeAt(0).toString(16).padStart(2,"0")).join("").slice(0,8);
}

function decodeABIString(hex) {
  if (!hex || hex === "0x") return "";
  try {
    const clean = hex.startsWith("0x") ? hex.slice(2) : hex;
    const len = parseInt(clean.slice(64, 128), 16) * 2;
    const strHex = clean.slice(128, 128 + len);
    const strBytes = [];
    for (let i = 0; i < strHex.length; i += 2) strBytes.push(parseInt(strHex.slice(i, i+2), 16));
    return new TextDecoder().decode(new Uint8Array(strBytes));
  } catch { return ""; }
}

async function glRead(contractAddress, method, args = []) {
  const res = await fetch(CONFIG.RPC_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      jsonrpc: "2.0", id: 1, method: "eth_call",
      params: [{ to: contractAddress, data: encodeCall(method, args) }, "latest"]
    })
  });
  const json = await res.json();
  return json.result;
}

async function glWrite(contractAddress, method, args = []) {
  if (!window.ethereum) throw new Error("No wallet");
  const data = encodeCall(method, args);
  return window.ethereum.request({
    method: "eth_sendTransaction",
    params: [{ from: walletAddress, to: contractAddress, data, gas: "0x100000" }]
  });
}

function setStatus(msg, loading = false) {
  document.querySelectorAll("#status").forEach(el => {
    el.textContent = msg;
    el.className = loading ? "loading" : "";
  });
}

// ─── TOPIC SELECTOR ──────────────────────────────────────────────────────────
document.querySelectorAll(".topic-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedTopic = btn.dataset.topic;
  });
});

// ─── CHAR COUNT ──────────────────────────────────────────────────────────────
document.getElementById("endingInput").addEventListener("input", function() {
  document.getElementById("charCount").textContent = this.value.length;
});

// ─── WALLET ──────────────────────────────────────────────────────────────────
document.getElementById("connectBtn").addEventListener("click", async () => {
  if (!window.ethereum) { alert("Please install MetaMask"); return; }
  const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
  walletAddress = accounts[0];
  document.getElementById("walletSection").innerHTML = `
    <div class="wallet-info">
      <div class="wallet-addr">${walletAddress.slice(0,6)}...${walletAddress.slice(-4)}</div>
      <div class="score-badge">Total: <span id="totalScoreDisplay">${totalScore}</span> pts</div>
    </div>
  `;
  document.getElementById("setupSection").classList.remove("hidden");
  loadLeaderboard();
});

// ─── START ROUND ─────────────────────────────────────────────────────────────
document.getElementById("startBtn").addEventListener("click", async () => {
  const nickname = document.getElementById("nicknameInput").value.trim();
  if (!walletAddress) { setStatus("Connect wallet first."); return; }

  const roundId = `sf_${Date.now()}_${walletAddress.slice(-4)}`;
  currentRound = { roundId, topic: selectedTopic };

  setStatus("⏳ Fetching a live news story...", true);
  document.getElementById("startBtn").disabled = true;

  try {
    if (nickname) await glWrite(CONFIG.STAT_CONTRACT, "set_nickname", [nickname]);
    await glWrite(CONFIG.GAME_CONTRACT, "start_round", [roundId, selectedTopic, "x", "x"]);
    setStatus("🧠 AI is preparing your story...", true);

    // Poll get_error for "Story:" prefix — same pattern as CountryClash
    let storyData = null;
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 6000));
      try {
        const raw = await glRead(CONFIG.GAME_CONTRACT, "get_error", []);
        const errStr = decodeABIString(raw);
        setStatus(`🧠 AI working... (${(i+1)*6}s)`, true);
        if (errStr.startsWith("Story:")) {
          // Parse: "Story:[headline]||Intro:[intro]"
          const storyPart = errStr.slice(6); // remove "Story:"
          const sepIdx = storyPart.indexOf("||Intro:");
          if (sepIdx !== -1) {
            storyData = {
              headline: storyPart.slice(0, sepIdx).trim(),
              intro: storyPart.slice(sepIdx + 8).trim()
            };
            break;
          }
        }
        if (errStr.includes("parse_error:") || errStr.includes("start_round error:")) {
          setStatus("Error fetching story: " + errStr);
          document.getElementById("startBtn").disabled = false;
          return;
        }
      } catch(e) { /* keep polling */ }
    }

    if (!storyData) {
      setStatus("Timed out. Please try again.");
      document.getElementById("startBtn").disabled = false;
      return;
    }

    // Show game arena
    currentRound.startTime = Date.now();
    document.getElementById("setupSection").classList.add("hidden");
    document.getElementById("storyHeadline").textContent = storyData.headline;
    document.getElementById("storyIntro").textContent = storyData.intro;
    document.getElementById("endingInput").value = "";
    document.getElementById("charCount").textContent = "0";
    document.getElementById("gameSection").classList.remove("hidden");
    setStatus("");
  } catch (e) {
    setStatus("Error: " + e.message);
    document.getElementById("startBtn").disabled = false;
  }
});

// ─── SUBMIT ENDING ───────────────────────────────────────────────────────────
document.getElementById("submitBtn").addEventListener("click", async () => {
  const ending = document.getElementById("endingInput").value.trim();
  if (!ending || ending.length < 20) { setStatus("Write at least 20 characters."); return; }
  if (!currentRound) { setStatus("No active round."); return; }

  setStatus("⏳ Submitting your ending...", true);
  document.getElementById("submitBtn").disabled = true;

  try {
    await glWrite(CONFIG.GAME_CONTRACT, "submit_answer", [currentRound.roundId, ending, elapsed]);
    setStatus("🧠 AI is reading the real story and judging your ending...", true);

    // Poll get_error for "Result:" prefix
    let resultData = null;
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 6000));
      try {
        const raw = await glRead(CONFIG.GAME_CONTRACT, "get_error", []);
        const errStr = decodeABIString(raw);
        setStatus(`🧠 Judging... (${(i+1)*6}s)`, true);
        if (errStr.startsWith("Result:Score:")) {
          const rest = errStr.slice(13); // remove "Result:Score:"
          const sepIdx = rest.indexOf("||Feedback:");
          if (sepIdx !== -1) {
            resultData = {
              score: parseInt(rest.slice(0, sepIdx)) || 0,
              feedback: rest.slice(sepIdx + 11).trim()
            };
            break;
          }
        }
        if (errStr.includes("submit_answer error:")) {
          setStatus("Error: " + errStr);
          document.getElementById("submitBtn").disabled = false;
          return;
        }
      } catch(e) { /* keep polling */ }
    }

    if (!resultData) {
      setStatus("Timed out getting result. Please try again.");
      document.getElementById("submitBtn").disabled = false;
      return;
    }

    showResult(resultData.score, resultData.feedback);
  } catch (e) {
    setStatus("Error: " + e.message);
    document.getElementById("submitBtn").disabled = false;
  }
});

// ─── RESULT ──────────────────────────────────────────────────────────────────
function showResult(score, feedback) {
  document.getElementById("gameSection").classList.add("hidden");
  const resultSection = document.getElementById("resultSection");
  resultSection.style.display = "flex";

  totalScore += score;
  document.getElementById("scoreDisplay").textContent = score;
  document.getElementById("feedbackBox").innerHTML = `<strong>AI Feedback:</strong><br>${feedback}`;

  const display = document.getElementById("totalScoreDisplay");
  if (display) display.textContent = totalScore;

  loadLeaderboard();
}

document.getElementById("playAgainBtn").addEventListener("click", () => {
  document.getElementById("resultSection").style.display = "none";
  document.getElementById("setupSection").classList.remove("hidden");
  document.getElementById("startBtn").disabled = false;
  document.getElementById("submitBtn").disabled = false;
  setStatus("");
});

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
window.loadLeaderboard = async function() {
  const container = document.getElementById("leaderboardList");
  container.innerHTML = '<div class="lb-row" style="color:var(--muted)">Loading...</div>';
  try {
    const raw = await glRead(CONFIG.STAT_CONTRACT, "get_points", [10]);
    const decoded = decodeABIString(raw);
    const data = JSON.parse(decoded || "[]");
    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = '<div class="lb-row" style="color:var(--muted)">No scores yet. Be the first!</div>';
      return;
    }
    container.innerHTML = data.map((entry, i) => `
      <div class="lb-row">
        <span class="rank">#${i+1}</span>
        <span class="nick">${entry.nick || entry.wallet.slice(0,8) + "..."}</span>
        <span class="pts">${entry.points} pts</span>
      </div>
    `).join("");
  } catch {
    container.innerHTML = '<div class="lb-row" style="color:var(--muted)">Could not load leaderboard.</div>';
  }
}

loadLeaderboard();
</script>
</body>
</html>

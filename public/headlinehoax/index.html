<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Headline Hoax — GenLayer Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1a1a24;
      --border: #1e1e2e;
      --accent: #ff6b6b;
      --accent2: #7b5ea7;
      --correct: #00e5a0;
      --danger: #ff4d6d;
      --text: #e8e8f0;
      --muted: #6b6b80;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    nav {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    nav a:hover { color: var(--accent); }
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.05em;
      text-align: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .subtitle { color: var(--muted); text-align: center; margin-bottom: 2.5rem; font-size: 0.95rem; }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.75rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      color: var(--correct);
      border: 1px solid var(--correct);
    }

    /* Wallet */
    #walletSection { margin-bottom: 2rem; text-align: center; }
    .wallet-info { display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; }
    .wallet-addr {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .score-badge {
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      color: var(--accent);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Setup */
    #setupSection {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    #setupSection h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.05em; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.4rem; }
    input, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }

    /* Topics */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .topic-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .topic-btn:hover { border-color: var(--accent); color: var(--text); }
    .topic-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,107,0.08); }

    /* Game arena */
    #gameSection {
      width: 100%;
      max-width: 860px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .topic-label {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 0.6rem 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .topic-label span { color: var(--accent); font-weight: 600; }

    /* Timer */
    .timer-wrap { width: 100%; }
    .timer-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.1s linear, background 0.5s;
    }
    .timer-text { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }

    /* Headline cards */
    .headlines {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }
    .headline-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, background 0.2s;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .headline-card:hover { border-color: var(--accent); transform: translateX(4px); }
    .headline-card.selected { border-color: var(--accent); background: rgba(255,107,107,0.05); }
    .headline-card.correct { border-color: var(--correct); background: rgba(0,229,160,0.07); }
    .headline-card.wrong { border-color: var(--danger); background: rgba(255,77,109,0.07); }
    .card-letter {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--accent);
      min-width: 2rem;
      line-height: 1;
    }
    .card-letter.correct-letter { color: var(--correct); }
    .card-letter.wrong-letter { color: var(--danger); }
    .headline-text {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--text);
    }

    /* Result */
    #resultSection {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    #resultSection h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 0.05em; }
    .result-correct { color: var(--correct); }
    .result-wrong { color: var(--danger); }
    .result-score { font-size: 1.1rem; color: var(--muted); }
    .result-score span { color: var(--accent); font-weight: 600; font-size: 1.4rem; }
    .real-headline-reveal {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: left;
      line-height: 1.5;
    }
    .real-headline-reveal strong { color: var(--correct); }

    /* Leaderboard */
    #leaderboardSection { width: 100%; max-width: 560px; margin-top: 2rem; }
    #leaderboardSection h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .lb-row .rank { color: var(--muted); width: 2rem; }
    .lb-row .nick { flex: 1; }
    .lb-row .pts { color: var(--accent); font-weight: 600; }

    #status {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.4rem;
    }
    .loading { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<nav>
  <a href="/">← All Games</a>
  <a href="/headlinehoax">Headline Hoax</a>
</nav>

<h1 class="title">Headline Hoax</h1>
<p class="subtitle">One headline is real. One is AI-generated. Can you spot the fake?</p>

<!-- Wallet -->
<div id="walletSection">
  <button class="btn" id="connectBtn">Connect Wallet</button>
</div>

<!-- Setup -->
<div id="setupSection" class="hidden">
  <h2>Start a Round</h2>
  <div>
    <label>Your Nickname</label>
    <input type="text" id="nicknameInput" placeholder="Enter nickname..." maxlength="25" />
  </div>
  <div>
    <label>Pick a Topic</label>
    <div class="topic-grid">
      <button class="topic-btn active" data-topic="World News">🌍 World News</button>
      <button class="topic-btn" data-topic="Tech">💻 Tech</button>
      <button class="topic-btn" data-topic="Crypto">₿ Crypto</button>
      <button class="topic-btn" data-topic="Science">🔬 Science</button>
      <button class="topic-btn" data-topic="Sports">⚽ Sports</button>
    </div>
  </div>
  <button class="btn" id="startBtn">⚡ Start Round</button>
  <div id="status"></div>
</div>

<!-- Game Arena -->
<div id="gameSection">
  <div class="topic-label">Topic: <span id="topicDisplay">World News</span></div>
  <div class="timer-wrap">
    <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
    <div class="timer-text" id="timerText">30s</div>
  </div>
  <p style="color:var(--muted);font-size:0.9rem;text-align:center;">Which headline is REAL?</p>
  <div class="headlines">
    <div class="headline-card" id="cardA" onclick="submitAnswer('A')">
      <span class="card-letter" id="letterA">A</span>
      <span class="headline-text" id="headlineA">Loading...</span>
    </div>
    <div class="headline-card" id="cardB" onclick="submitAnswer('B')">
      <span class="card-letter" id="letterB">B</span>
      <span class="headline-text" id="headlineB">Loading...</span>
    </div>
  </div>
  <div id="status"></div>
</div>

<!-- Result -->
<div id="resultSection">
  <h2 id="resultTitle"></h2>
  <p class="result-score">Points earned: <span id="resultScore">0</span></p>
  <div class="real-headline-reveal" id="realHeadlineReveal"></div>
  <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem;">
    <button class="btn" id="playAgainBtn">Play Again</button>
  </div>
</div>

<!-- Leaderboard -->
<div id="leaderboardSection">
  <h3>🏆 Leaderboard</h3>
  <div id="leaderboardList"></div>
  <button class="btn-outline btn" style="margin-top:1rem;width:100%;" onclick="loadLeaderboard()">Refresh</button>
</div>

<script type="module">
const CONFIG = {
  GAME_CONTRACT: "0xCd7E16F924bA8fd92f06C02610F2641F874b08C4",
  STORAGE_CONTRACT: "0xC0378B36041bCAa14feA5F8De1430bB0d0631D8a",
  STAT_CONTRACT: "0x9706EF854673dDeA6c0F07F3288fFE461a738050",
  RPC_URL: "https://studio.genlayer.com/api",
};

let walletAddress = null;
let currentRound = null;
let timerInterval = null;
let startTime = null;
let answered = false;
let totalScore = 0;
let selectedTopic = "World News";
let currentRealIsA = false;

// ─── GENLAYER CLIENT ─────────────────────────────────────────────────────────
async function glRead(contractAddress, method, args = []) {
  const res = await fetch(CONFIG.RPC_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      jsonrpc: "2.0", id: 1, method: "eth_call",
      params: [{ to: contractAddress, data: encodeCall(method, args) }, "latest"]
    })
  });
  const json = await res.json();
  return json.result;
}

async function glWrite(contractAddress, method, args = []) {
  if (!window.ethereum) throw new Error("No wallet");
  const data = encodeCall(method, args);
  return window.ethereum.request({
    method: "eth_sendTransaction",
    params: [{ from: walletAddress, to: contractAddress, data, gas: "0x100000" }]
  });
}

function encodeCall(method, args) {
  const sig = method + "(" + args.map(a => typeof a === "number" ? "uint256" : "string").join(",") + ")";
  const hash = keccak256(sig).slice(0, 10);
  const encoded = args.map(a => {
    if (typeof a === "number") return a.toString(16).padStart(64, "0");
    const hex = Array.from(new TextEncoder().encode(a)).map(b => b.toString(16).padStart(2,"0")).join("");
    const offset = (64).toString(16).padStart(64, "0");
    const len = (a.length).toString(16).padStart(64, "0");
    const data = hex.padEnd(Math.ceil(hex.length / 64) * 64, "0");
    return offset + len + data;
  });
  return hash + encoded.join("");
}

function keccak256(str) {
  if (window.ethers) return window.ethers.utils.id(str);
  return "0x" + Array.from(str).map(c => c.charCodeAt(0).toString(16).padStart(2,"0")).join("").slice(0,8);
}

function decodeABIString(hex) {
  if (!hex || hex === "0x") return "[]";
  try {
    const clean = hex.startsWith("0x") ? hex.slice(2) : hex;
    const bytes = [];
    for (let i = 0; i < clean.length; i += 2) bytes.push(parseInt(clean.slice(i, i+2), 16));
    const offset = parseInt(clean.slice(0, 64), 16) * 2;
    const len = parseInt(clean.slice(64, 128), 16) * 2;
    const strHex = clean.slice(128, 128 + len);
    const strBytes = [];
    for (let i = 0; i < strHex.length; i += 2) strBytes.push(parseInt(strHex.slice(i, i+2), 16));
    return new TextDecoder().decode(new Uint8Array(strBytes));
  } catch { return "[]"; }
}

function setStatus(msg, loading = false) {
  const el = document.getElementById("status");
  if (el) { el.textContent = msg; el.className = loading ? "loading" : ""; }
}

// ─── TOPIC SELECTOR ──────────────────────────────────────────────────────────
document.querySelectorAll(".topic-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedTopic = btn.dataset.topic;
  });
});

// ─── WALLET ──────────────────────────────────────────────────────────────────
document.getElementById("connectBtn").addEventListener("click", async () => {
  if (!window.ethereum) { alert("Please install MetaMask"); return; }
  const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
  walletAddress = accounts[0];
  document.getElementById("walletSection").innerHTML = `
    <div class="wallet-info">
      <div class="wallet-addr">${walletAddress.slice(0,6)}...${walletAddress.slice(-4)}</div>
      <div class="score-badge">Score: <span id="scoreDisplay">${totalScore}</span></div>
    </div>
  `;
  document.getElementById("setupSection").classList.remove("hidden");
  loadLeaderboard();
});

// ─── START ROUND ─────────────────────────────────────────────────────────────
document.getElementById("startBtn").addEventListener("click", async () => {
  const nickname = document.getElementById("nicknameInput").value.trim();
  if (!walletAddress) { setStatus("Connect wallet first."); return; }

  const roundId = `hh_${Date.now()}_${walletAddress.slice(-4)}`;
  currentRound = { roundId, topic: selectedTopic };

  setStatus("⏳ Fetching live headlines from the web...", true);
  document.getElementById("startBtn").disabled = true;

  try {
    if (nickname) await glWrite(CONFIG.STAT_CONTRACT, "set_nickname", [nickname]);
    await glWrite(CONFIG.GAME_CONTRACT, "start_round", [roundId, selectedTopic]);
    setStatus("🧠 AI is generating the fake headline...", true);

    // Show arena with loading placeholders, poll for headlines in background
    showGameArenaLoading();
    pollForHeadlines();
  } catch (e) {
    setStatus("Error: " + e.message);
    document.getElementById("startBtn").disabled = false;
  }
});

function showGameArenaLoading() {
  document.getElementById("setupSection").classList.add("hidden");
  document.getElementById("gameSection").style.display = "flex";
  document.getElementById("topicDisplay").textContent = selectedTopic;
  document.getElementById("headlineA").textContent = "⏳ Loading...";
  document.getElementById("headlineB").textContent = "⏳ Loading...";
  document.getElementById("cardA").style.pointerEvents = "none";
  document.getElementById("cardB").style.pointerEvents = "none";
  // Hide timer until headlines are ready
  document.getElementById("timerBar").style.width = "0%";
  document.getElementById("timerText").textContent = "30s";
  answered = false;
}

async function pollForHeadlines() {
  // Step 1: Poll get_error until it confirms round started
  let roundReady = false;
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 6000));
    setStatus(`🧠 AI fetching headlines... (${(i + 1) * 6}s)`, true);
    try {
      const errRaw = await glRead(CONFIG.GAME_CONTRACT, "get_error", []);
      const errDecoded = decodeABIString(errRaw);
      if (errDecoded && errDecoded.includes("Round started:")) {
        roundReady = true;
        break;
      }
    } catch (e) { /* keep polling */ }
  }

  if (!roundReady) {
    setStatus("Timed out. Please try again.");
    document.getElementById("gameSection").style.display = "none";
    document.getElementById("setupSection").classList.remove("hidden");
    document.getElementById("startBtn").disabled = false;
    return;
  }

  // Step 2: Read the active round
  try {
    const raw = await glRead(CONFIG.GAME_CONTRACT, "get_active_round", []);
    const parsed = JSON.parse(decodeABIString(raw));
    if (!parsed.error && parsed.real_headline && parsed.real_headline.length > 5) {
      currentRealIsA = Math.random() > 0.5;
      currentRound.realHeadline = parsed.real_headline;
      currentRound.fakeHeadline = parsed.fake_headline;
      document.getElementById("headlineA").textContent = currentRealIsA ? parsed.real_headline : parsed.fake_headline;
      document.getElementById("headlineB").textContent = currentRealIsA ? parsed.fake_headline : parsed.real_headline;
      document.getElementById("cardA").style.pointerEvents = "auto";
      document.getElementById("cardB").style.pointerEvents = "auto";
      startTime = Date.now();
      startTimer(30);
      setStatus("Pick the REAL headline!");
      return;
    }
  } catch (e) { /* fall through */ }

  setStatus("Could not load headlines. Please try again.");
  document.getElementById("gameSection").style.display = "none";
  document.getElementById("setupSection").classList.remove("hidden");
  document.getElementById("startBtn").disabled = false;
}

// ─── TIMER ───────────────────────────────────────────────────────────────────
function startTimer(seconds) {
  const bar = document.getElementById("timerBar");
  const text = document.getElementById("timerText");
  let remaining = seconds;
  timerInterval = setInterval(() => {
    remaining -= 0.1;
    const pct = (remaining / seconds) * 100;
    bar.style.width = pct + "%";
    bar.style.background = pct > 50 ? "var(--accent)" : pct > 25 ? "#f5a623" : "var(--danger)";
    text.textContent = Math.ceil(remaining) + "s";
    if (remaining <= 0) { clearInterval(timerInterval); if (!answered) submitAnswer(null); }
  }, 100);
}

// ─── SUBMIT ANSWER ───────────────────────────────────────────────────────────
window.submitAnswer = async function(choice) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const pickedReal = (choice === "A" && currentRealIsA) || (choice === "B" && !currentRealIsA);
  const playerAnswer = pickedReal ? "REAL" : "FAKE";

  if (choice === "A") document.getElementById("cardA").classList.add("selected");
  if (choice === "B") document.getElementById("cardB").classList.add("selected");

  setStatus("⏳ Submitting answer...", true);

  try {
    await glWrite(CONFIG.GAME_CONTRACT, "submit_answer", [currentRound.roundId, playerAnswer, elapsed]);
    await new Promise(r => setTimeout(r, 6000));

    const errorResult = await glRead(CONFIG.GAME_CONTRACT, "get_error", []);
    const decoded = decodeABIString(errorResult);
    const isCorrect = decoded.includes("Score:") && !decoded.includes("Score: 0");
    const scoreMatch = decoded.match(/Score: (\d+)/);
    const score = scoreMatch ? parseInt(scoreMatch[1]) : 0;

    const realCard = currentRealIsA ? "cardA" : "cardB";
    const fakeCard = currentRealIsA ? "cardB" : "cardA";
    document.getElementById(realCard).classList.add("correct");
    document.getElementById(fakeCard).classList.add("wrong");

    showResult(isCorrect, score);
  } catch (e) {
    setStatus("Error: " + e.message);
  }
}

// ─── RESULT ──────────────────────────────────────────────────────────────────
function showResult(isCorrect, score) {
  document.getElementById("gameSection").style.display = "none";
  document.getElementById("resultSection").style.display = "flex";

  if (isCorrect) {
    totalScore += score;
    document.getElementById("resultTitle").textContent = "✅ Correct!";
    document.getElementById("resultTitle").className = "result-correct";
  } else {
    document.getElementById("resultTitle").textContent = "❌ Fooled!";
    document.getElementById("resultTitle").className = "result-wrong";
  }

  document.getElementById("resultScore").textContent = "+" + score;
  document.getElementById("realHeadlineReveal").innerHTML =
    `<strong>Real headline:</strong><br>${currentRound.realHeadline}`;

  const scoreDisplay = document.getElementById("scoreDisplay");
  if (scoreDisplay) scoreDisplay.textContent = totalScore;

  loadLeaderboard();
}

document.getElementById("playAgainBtn").addEventListener("click", () => {
  document.getElementById("resultSection").style.display = "none";
  document.getElementById("setupSection").classList.remove("hidden");
  document.getElementById("startBtn").disabled = false;
  document.getElementById("cardA").className = "headline-card";
  document.getElementById("cardB").className = "headline-card";
  setStatus("");
});

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
window.loadLeaderboard = async function() {
  const container = document.getElementById("leaderboardList");
  container.innerHTML = '<div class="lb-row" style="color:var(--muted)">Loading...</div>';
  try {
    const raw = await glRead(CONFIG.STAT_CONTRACT, "get_points", [10]);
    const data = JSON.parse(decodeABIString(raw));
    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = '<div class="lb-row" style="color:var(--muted)">No scores yet. Be the first!</div>';
      return;
    }
    container.innerHTML = data.map((entry, i) => `
      <div class="lb-row">
        <span class="rank">#${i+1}</span>
        <span class="nick">${entry.nick || entry.wallet.slice(0,8) + "..."}</span>
        <span class="pts">${entry.points} pts</span>
      </div>
    `).join("");
  } catch {
    container.innerHTML = '<div class="lb-row" style="color:var(--muted)">Could not load leaderboard.</div>';
  }
}

loadLeaderboard();
</script>
</body>
</html>
